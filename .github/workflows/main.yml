name: Windows Build and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Report bundled runtime resources (non-blocking)
        shell: pwsh
        run: |
          $required = @(
            'resources/mpv',
            'resources/jvm/jre',
            'resources/jvm/libs',
            'resources/jvm/stubs',
            'resources/jvm/shell-shim',
            'resources/jvm/real'
          )
          $missing = @()
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Container)) {
              $missing += $path
              Write-Host "MISSING: $path"
            } else {
              $files = @(Get-ChildItem -LiteralPath $path -Force -Recurse -File -ErrorAction SilentlyContinue)
              if ($files.Count -eq 0) {
                $missing += "$path (empty)"
                Write-Host "EMPTY: $path"
              } else {
                $bytes = ($files | Measure-Object -Property Length -Sum).Sum
                Write-Host ("OK: {0} | {1} files | {2:N1} MiB" -f $path, $files.Count, ($bytes / 1MB))
              }
            }
          }
          if ($missing.Count -gt 0) {
            $message = "Some optional/runtime resource paths are absent. The build will continue, but related features may be unavailable: " + ($missing -join ', ')
            Write-Warning $message
            Write-Host "::warning::$message"
          } else {
            Write-Host 'All checked runtime resource paths are present.'
          }

      - name: Run tests
        run: pnpm test

      - name: TypeScript type check
        run: pnpm run typecheck

      - name: Build application
        run: pnpm run build

      - name: Prepare license file for electron-builder
        shell: pwsh
        run: Copy-Item -LiteralPath LICENSE -Destination LICENSE.txt -Force

      - name: Package Windows installer
        run: pnpm exec electron-builder --win nsis --publish never

      - name: Verify installer exists
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path 'release*/*.exe' -File -ErrorAction SilentlyContinue)
          if ($installers.Count -eq 0) {
            Write-Error 'No Windows installer was produced; refusing to publish.'
            exit 1
          }
          $installers | ForEach-Object {
            Write-Host ("Installer: {0} | {1:N1} MiB" -f $_.FullName, ($_.Length / 1MB))
          }

      - name: Upload installer to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: win-box-build-${{ github.run_number }}-${{ github.run_attempt }}
          name: Win-Box Windows Build ${{ github.run_number }}.${{ github.run_attempt }}
          body: |
            Automated Windows installer build from commit ${{ github.sha }}.
            Runtime-resource presence was reported in the Actions log; missing paths do not block packaging.
            Some playback/JVM features may be unavailable if their runtime files are not bundled.
            Download the `.exe` installer from the assets below.
          files: release*/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: false
          prerelease: true
