name: Windows Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: TypeScript type check
        run: pnpm run typecheck

      - name: Build application
        run: pnpm run build

      - name: Prepare license file for electron-builder
        shell: pwsh
        run: Copy-Item -LiteralPath LICENSE -Destination LICENSE.txt -Force

      - name: Package Windows installer
        run: pnpm exec electron-builder --win nsis --publish never

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Win-Box-Windows-${{ github.sha }}
          path: release1.21.01/*.exe
          if-no-files-found: error
          retention-days: 14
