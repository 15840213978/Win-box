name: Windows Build and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    # Do not publish a Release from pull requests; only build/test them.
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: TypeScript type check
        run: pnpm run typecheck

      - name: Build application
        run: pnpm run build

      - name: Prepare license file for electron-builder
        shell: pwsh
        run: Copy-Item -LiteralPath LICENSE -Destination LICENSE.txt -Force

      - name: Package Windows installer
        run: pnpm exec electron-builder --win nsis --publish never

      - name: Upload installer to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: win-box-build-${{ github.run_number }}-${{ github.run_attempt }}
          name: Win-Box Windows Build ${{ github.run_number }}.${{ github.run_attempt }}
          body: |
            Automated Windows installer build from commit ${{ github.sha }}.
            Download the `.exe` installer from the assets below.
          files: release*/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: false
          prerelease: true
